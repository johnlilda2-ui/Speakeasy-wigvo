name: Krisp Opus transport checks
on:
  push:
    branches: [feature/krisp-opus-latency-2026-11-27]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r soniox_telephony/requirements.txt
      - run: python -m unittest discover -s soniox_telephony/tests -p test_krisp_opus.py -v
