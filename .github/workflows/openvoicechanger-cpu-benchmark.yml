name: OpenVoiceChanger CPU benchmark

on:
  push:
    branches:
      - bench/openvoicechanger-cpu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-rvc-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "CPU:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg

      - name: Run OpenVoiceChanger RVC CPU benchmark
        run: |
          python3 bench/openvoicechanger_cpu.py
